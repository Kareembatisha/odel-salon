<!-- Back to login -->
<a href="#" class="back-link" (click)="$event.preventDefault(); backToLogin()">
  <i class="pi pi-arrow-left"></i>
  {{ 'AUTH.BACK_TO_LOGIN' | translate }}
</a>

<!-- Icon -->
<div class="icon-circle">
  <i class="pi pi-lock"></i>
</div>

<!-- Card header -->
<div class="card-header card-header--center">
  <h2 class="card-title">{{ 'AUTH.FORGOT_TITLE' | translate }}</h2>
  <p class="card-subtitle">{{ 'AUTH.FORGOT_SUBTITLE' | translate }}</p>
</div>

<!-- Form -->
<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="auth-form">

  <app-float-label-input
    label="AUTH.EMAIL_LABEL"
    type="email"
    iconLeft="pi pi-envelope"
    autocomplete="email"
    [errorMessage]="email.touched && email.hasError('required') ? 'AUTH.EMAIL_REQUIRED'
                  : email.touched && email.hasError('email')    ? 'AUTH.EMAIL_INVALID'
                  : ''"
    formControlName="email"
  />



  <button type="submit" class="submit-btn" [disabled]="loading()">
    {{ (loading() ? 'AUTH.SENDING' : 'AUTH.SEND_CODE') | translate }}
  </button>

</form>

<!-- Card footer -->
<div class="card-footer">
  <p class="help-text">
    {{ 'AUTH.REMEMBER_PASSWORD' | translate }}
    <a href="#" class="help-link" (click)="$event.preventDefault(); backToLogin()">
      {{ 'AUTH.SIGN_IN' | translate }}
    </a>
  </p>
</div>
