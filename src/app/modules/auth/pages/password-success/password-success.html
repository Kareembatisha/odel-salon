<!-- Success icon -->
<div class="success-icon-wrap">
  <span class="deco deco--diamond" aria-hidden="true"></span>
  <span class="deco deco--dot" aria-hidden="true"></span>
  <span class="deco deco--triangle" aria-hidden="true"></span>

  <div class="success-circle">
    <i class="pi pi-check"></i>
  </div>
</div>

<!-- Card header -->
<div class="card-header">
  <h2 class="card-title">{{ 'AUTH.PASSWORD_UPDATED_TITLE' | translate }}</h2>
  <p class="card-subtitle">{{ 'AUTH.PASSWORD_UPDATED_SUBTITLE' | translate }}</p>
</div>

<!-- Badge -->
<div class="secured-badge">
  <i class="pi pi-shield"></i>
  {{ 'AUTH.ACCOUNT_SECURED' | translate }}
</div>

<!-- Actions -->
<div class="actions">
  <button type="button" class="primary-btn" (click)="goToLogin()">
    {{ 'AUTH.GO_TO_LOGIN' | translate }}
  </button>
</div>

<!-- Footer -->
<hr class="card-divider" />
<p class="timestamp">
  {{ 'AUTH.CHANGED_ON' | translate }} {{ changedAt | date: 'MMMM d, y' }} {{ 'AUTH.AT' | translate }} {{ changedAt | date: 'h:mm a' }}
</p>
